name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Собрать www и картинки
        run: |
          mkdir -p www/data www/img/icon www/img/render www/img/mods
          cp index.html app.js style.css www/
          if [ -f cover.jpg ]; then cp cover.jpg www/; fi
          cp data.json quests.json www/data/
          for z in pack_*.zip; do unzip -oq "$z" -d .; done
          python3 make_index.py
      - name: Capacitor и Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wt-quests-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
